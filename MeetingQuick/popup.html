<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingQuick</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">MeetingQuick</h1>
      <div class="date-display" id="dateDisplay"></div>
    </header>
    
    <div class="add-meeting-section">
      <form id="addMeetingForm" class="add-meeting-form">
        <div class="form-row">
          <input type="text" id="meetingTitle" class="form-input" placeholder="Meeting title" required>
          <input type="time" id="meetingTime" class="form-input" required>
        </div>
        <div class="form-row">
          <input type="url" id="meetingUrl" class="form-input" placeholder="Meeting URL (Zoom/Meet/Teams)">
          <select id="meetingType" class="form-select">
            <option value="Zoom">Zoom</option>
            <option value="Google Meet">Google Meet</option>
            <option value="Microsoft Teams">Microsoft Teams</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit" class="add-btn">Add Meeting</button>
      </form>
    </div>
    
    <div class="meetings-section">
      <div class="section-header">
        <h2>Today's Meetings</h2>
        <button class="refresh-btn" id="refreshBtn" title="Refresh meetings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      
      <div class="meetings-list" id="meetingsList">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Loading meetings...</p>
        </div>
        <div class="empty-state" id="emptyState" style="display: none;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <p>No meetings scheduled for today</p>
        </div>
      </div>
    </div>
    
    <footer class="footer">
      <button class="settings-btn" id="settingsBtn">Settings</button>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
